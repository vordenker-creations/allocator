services:
  db:
    image: mysql:8.4
    container_name: vku_allocator_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASS:-vku_root_secret}"
      MYSQL_DATABASE: "${DB_NAME:-vku_allocator}"
      MYSQL_USER: "${DB_USER:-vku_user}"
      MYSQL_PASSWORD: "${DB_PASS:-vku_password}"
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-vku_user}", "-p${DB_PASS:-vku_password}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vku_allocator_app
    restart: unless-stopped
    environment:
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_NAME: "${DB_NAME:-vku_allocator}"
      DB_USER: "${DB_USER:-vku_user}"
      DB_PASS: "${DB_PASS:-vku_password}"
      TZ: Asia/Ho_Chi_Minh
      APP_TZ: Asia/Ho_Chi_Minh
      ALLOCATOR_PUBLIC_HOST: "${ALLOCATOR_PUBLIC_HOST:-allocator.vordenker.work}"
      ALLOCATOR_SHELL_URL: "${ALLOCATOR_SHELL_URL:-https://shell.vordenker.work}"
      PROXMOX_HOST: "${PROXMOX_HOST:-https://192.168.1.200:8006}"
      PROXMOX_NODE: "${PROXMOX_NODE:-vor-server}"
      PROXMOX_TOKEN_ID: "${PROXMOX_TOKEN_ID:-}"
      PROXMOX_TOKEN_SECRET: "${PROXMOX_TOKEN_SECRET:-}"
      PROXMOX_LEASE_VMID: "${PROXMOX_LEASE_VMID:-200}"
      PROXMOX_LEASE_GUEST_TYPE: "${PROXMOX_LEASE_GUEST_TYPE:-lxc}"
      PROXMOX_HOST_VMID: "${PROXMOX_HOST_VMID:-100}"
      PROXMOX_CLEAN_SNAPSHOT: "${PROXMOX_CLEAN_SNAPSHOT:-clean}"
    ports:
      - "${APP_PORT:-8090}:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
